[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alertflow"
version = "0.7.0"
description = "SOC alert triage workflow with enrichment and live integration"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "httpx>=0.27.0",
    "typer>=0.24.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "n3xuslib @ git+https://github.com/glopez21/n3xuslib.git",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.0.0",
    "aiomysql>=0.2.0",
    "aiokafka>=0.10.0",
]

[project.scripts]
alertflow = "main:app"

[project.optional-dependencies]
augur = ["augur-client @ git+https://github.com/glopez21/augur-client.git"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
