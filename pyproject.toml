[project]
name = "alertflow"
version = "0.6.0"
description = "SOC alert triage workflow with enrichment and live integration"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "httpx>=0.27.0",
    "typer>=0.24.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
]
